<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 94" role="img" aria-labelledby="title desc">
  <title id="title">Project constellation</title>
  <desc id="desc">Four project nodes connected by a moving signal.</desc>
  <g fill="none" stroke="#9b9b96" stroke-width="1">
    <path id="route" d="M42 60L245 28L450 60L655 28L858 60"/>
    <path d="M42 74H858" stroke-dasharray="2 7" opacity=".55"/>
  </g>
  <g fill="#171717">
    <circle cx="42" cy="60" r="5"><animate attributeName="r" values="4;7;4" dur="3.2s" repeatCount="indefinite"/></circle>
    <rect x="240" y="23" width="10" height="10" transform="rotate(45 245 28)"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></rect>
    <circle cx="450" cy="60" r="5"><animate attributeName="r" values="4;7;4" dur="3.2s" begin=".8s" repeatCount="indefinite"/></circle>
    <rect x="650" y="23" width="10" height="10" transform="rotate(45 655 28)"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".7s" repeatCount="indefinite"/></rect>
    <circle cx="858" cy="60" r="5"><animate attributeName="r" values="4;7;4" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#f1f0eb" stroke="#171717" stroke-width="2">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
  </g>
  <g fill="#5f5f5b" font-family="monospace" font-size="8" letter-spacing="1.3">
    <text x="42" y="88">AI</text><text x="245" y="88" text-anchor="middle">VM</text><text x="450" y="88" text-anchor="middle">NET</text><text x="655" y="88" text-anchor="middle">HW</text><text x="858" y="88" text-anchor="end">NEXT</text>
  </g>
</svg>
