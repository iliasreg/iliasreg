<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic ensō</title>
  <desc id="desc">A transparent monochrome kinetic ensō aligned to the right.</desc>
  <g transform="translate(700 170)">
    <circle r="148" fill="none" stroke="#9b9b96" stroke-width="1" stroke-dasharray="3 10"/>
    <g>
      <circle r="109" fill="none" stroke="#171717" stroke-width="39" stroke-linecap="round" stroke-dasharray="578 105" transform="rotate(-28)"/>
      <circle r="82" fill="none" stroke="#171717" stroke-width="2" stroke-dasharray="245 39 12 25" opacity=".68"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
    <circle r="32" fill="#171717"/>
    <text y="9" fill="#ffffff" text-anchor="middle" font-family="serif" font-size="26">間</text>
    <g>
      <line y1="-148" y2="-123" stroke="#171717"/>
      <circle cy="-148" r="6" fill="#171717"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
